<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visa Slot Alert Settings</title>
    <style>
      :root {
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        max-width: 700px;
        margin: 20px auto;
        padding: 0 16px 20px;
      }
      h1 {
        margin: 0 0 14px;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 16px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input {
        width: 100%;
        max-width: 420px;
        padding: 6px 8px;
        border: 1px solid #94a3b8;
        border-radius: 8px;
      }
      input[type="checkbox"] {
        width: auto;
        max-width: none;
        margin-right: 8px;
        vertical-align: middle;
      }
      button {
        margin-top: 12px;
        border: 0;
        border-radius: 8px;
        padding: 8px 12px;
        font-weight: 600;
        color: #fff;
        background: #1d4ed8;
        cursor: pointer;
      }
      p {
        margin: 8px 0;
      }
      .small {
        font-size: 13px;
        color: #334155;
      }
      #status {
        font-size: 13px;
      }
      .row {
        margin-top: 12px;
      }
      .inline {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #testEmail {
        background: #0f766e;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Visa Slot Alert Settings</h1>
      <div class="card">
        <div class="row">
          <label for="visaCategory">Visa category</label>
          <select id="visaCategory" style="padding:6px 8px;border:1px solid #94a3b8;border-radius:8px;max-width:420px;width:100%;"></select>
        </div>
        <p class="small"><strong>Target URL:</strong> <span id="targetUrl"></span></p>
        <div class="row">
          <label for="targetMonth">Target month</label>
          <div class="inline">
            <select id="targetMonthSelect" style="padding:6px 8px;border:1px solid #94a3b8;border-radius:8px;">
              <option value="January">January</option>
              <option value="February">February</option>
              <option value="March">March</option>
              <option value="April">April</option>
              <option value="May">May</option>
              <option value="June">June</option>
              <option value="July">July</option>
              <option value="August">August</option>
              <option value="September">September</option>
              <option value="October">October</option>
              <option value="November">November</option>
              <option value="December">December</option>
            </select>
            <input id="targetYear" type="number" min="2025" max="2030" style="width:80px;" />
          </div>
        </div>
        <div class="row">
          <label for="intervalMinutes">Check interval (minutes, 1-60)</label>
          <input id="intervalMinutes" type="number" min="1" max="60" />
        </div>

        <div class="row">
          <label class="inline" for="emailEnabled">
            <input id="emailEnabled" type="checkbox" />
            Enable email alerts
          </label>
        </div>

        <div class="row">
          <label for="emailTo">Email destination</label>
          <input id="emailTo" type="email" placeholder="you@example.com" />
        </div>

        <div class="row">
          <label for="emailjsServiceId">EmailJS service ID</label>
          <input id="emailjsServiceId" type="text" placeholder="service_xxxxxxx" />
        </div>

        <div class="row">
          <label for="emailjsTemplateId">EmailJS template ID</label>
          <input id="emailjsTemplateId" type="text" placeholder="template_xxxxxxx" />
        </div>

        <div class="row">
          <label for="emailjsPublicKey">EmailJS public key</label>
          <input id="emailjsPublicKey" type="text" placeholder="xxxxxxxxxxxxxxx" />
        </div>

        <div class="row">
          <label class="inline" for="notifyDateChange">
            <input id="notifyDateChange" type="checkbox" />
            Notify when Biometrics or CA dates change
          </label>
        </div>

        <div class="row">
          <label class="inline" for="debugEnabled">
            <input id="debugEnabled" type="checkbox" />
            Show debug info in popup
          </label>
        </div>

        <button id="save">Save settings</button>
        <button id="testEmail" type="button">Send test email</button>
        <p class="small">
          Notifies when new Biometrics or CA dates are detected.
        </p>
        <p class="small">
          Email uses EmailJS. Template variables sent: <code>to_email</code>,
          <code>subject</code>, <code>message</code>, <code>target_month</code>,
          <code>target_url</code>, <code>evidence</code>, <code>vac_latest_date</code>,
          <code>non_vac_latest_date</code>, <code>checked_at</code>.
        </p>
        <p id="status"></p>
      </div>
    </main>
    <script src="options.js"></script>
  </body>
</html>
