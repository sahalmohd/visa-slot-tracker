<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visa Slot Alert</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      body {
        margin: 0;
        width: 320px;
        background: #f8fafc;
        color: #0f172a;
      }
      main {
        padding: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      p {
        margin: 6px 0;
        font-size: 13px;
        line-height: 1.35;
      }
      .status {
        font-weight: 700;
      }
      .open {
        color: #b91c1c;
      }
      .closed {
        color: #0369a1;
      }
      .error {
        color: #b45309;
      }
      button {
        margin-top: 10px;
        border: 0;
        border-radius: 8px;
        padding: 9px 12px;
        font-weight: 600;
        color: #fff;
        background: #1d4ed8;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      a {
        display: inline-block;
        margin-top: 10px;
        font-size: 12px;
      }
      .muted {
        color: #475569;
      }
      .bulletin-link {
        color: #1d4ed8;
        text-decoration: underline;
        cursor: pointer;
      }
      .coming-soon {
        color: #b45309;
        font-weight: 600;
      }
      .published {
        color: #15803d;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Visa Slot Alert</h1>
      <p class="muted" id="visaCategory">Category: L-1 Individual (Regular)</p>
      <p class="muted" id="targetMonth">Target: July 2026</p>
      <p class="status closed" id="status">Checking...</p>
      <p class="muted" id="lastCheck">Last check: never</p>
      <p class="muted" id="source">Source: unknown</p>
      <p class="muted" id="vacLatest">Latest Biometrics date: Not found</p>
      <p class="muted" id="nonVacLatest">Latest CA date: Not found</p>
      <p class="muted" id="evidence"></p>

      <hr style="border:none;border-top:1px solid #e2e8f0;margin:12px 0 8px;" />
      <h2 style="margin:0 0 6px;font-size:14px;">Visa Bulletin</h2>
      <p class="muted" id="bulletinCurrent">Current: —</p>
      <p class="muted" id="bulletinUpcoming">Upcoming: —</p>

      <button id="checkNow">Check now</button>
      <br />
      <div id="debugSection" style="display:none;">
        <details style="margin-top:10px;font-size:11px;">
          <summary style="cursor:pointer;color:#475569;">Debug info</summary>
          <button id="copyDebug" style="margin:4px 0;padding:4px 8px;font-size:10px;border:1px solid #94a3b8;border-radius:4px;background:#fff;cursor:pointer;">Copy to clipboard</button>
          <pre id="debugInfo" style="white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto;background:#e2e8f0;padding:6px;border-radius:4px;font-size:10px;"></pre>
        </details>
      </div>
      <a href="../options/options.html" target="_blank" rel="noreferrer">Open settings</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
